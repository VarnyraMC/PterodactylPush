plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.varnyra'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

gradlePlugin {
    plugins {
        pterodactylPush {
            id = 'com.varnyra.pterodactylpush'
            implementationClass = 'com.varnyra.pterodactylpush.PterodactylPushPlugin'
            displayName = 'Pterodactyl Push'
            description = 'Deploy files to Pterodactyl servers directly from Gradle.'
        }
    }
}

publishing {
    repositories {
        maven {
            name = "Reposilite"
            url = "https://maven.varnyra.com"

            credentials {
                username = System.getenv("REPOSILITE_USERNAME")
                password = System.getenv("REPOSILITE_TOKEN")
            }
        }
    }
}